<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>여정표 — 우리 멤버에 맞는 여행 추천</title>
<style>
  :root{
    --paper:#EDEFE6; --ink:#1C2B3F; --ink-soft:#4A5A6B;
    --teal:#1F7A6C; --teal-dark:#155A50; --amber:#D9992B; --coral:#C1543D; --line:#C9CDBC;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:sans-serif; line-height:1.55;}
  h1,h2,h3{margin:0; color:var(--ink);}
  .wrap{max-width:920px; margin:0 auto; padding:0 20px 80px;}
  .hero{padding:40px 20px; max-width:920px; margin:0 auto;}
  .hero h1{font-size:clamp(28px,5vw,44px); line-height:1.2;}
  .hero p{color:var(--ink-soft); font-size:16px;}
  .card{background:#fff; border-radius:16px; padding:28px; box-shadow:0 10px 26px rgba(28,43,63,.1);}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px;}
  .field label{font-size:13px; font-weight:600; color:var(--ink-soft); display:block; margin-bottom:6px;}
  .field input{width:100%; border:1.5px solid var(--line); border-radius:10px; padding:10px 12px; font-size:15px; background:var(--paper);}
  .ages-box{display:flex; flex-wrap:wrap; gap:8px; padding:10px; border:1.5px dashed var(--line); border-radius:10px; background:var(--paper); min-height:48px; align-items:center;}
  .age-chip{display:flex; align-items:center; gap:4px; background:#fff; border:1px solid var(--line); border-radius:999px; padding:4px 6px 4px 12px; font-size:13px;}
  .age-chip input{width:42px; border:none; background:transparent; font-size:13px; padding:2px;}
  .age-chip select{border:none; background:transparent; font-size:13px; padding:2px; color:var(--ink);}
  .age-chip button{border:none; background:#EDEFE2; border-radius:999px; width:20px; height:20px; cursor:pointer; color:var(--ink-soft);}
  .add-age{border:1.5px dashed var(--teal); color:var(--teal-dark); background:none; border-radius:999px; padding:5px 12px; font-size:13px; font-weight:600; cursor:pointer;}
  .submit-btn{margin-top:18px; width:100%; background:var(--coral); color:#fff; border:none; border-radius:12px; padding:13px; font-size:15px; font-weight:700; cursor:pointer;}
  .submit-btn:disabled{opacity:.6;}
  .status{margin-top:12px; font-size:13px; color:var(--ink-soft);}
  .error{color:var(--coral); font-weight:600;}
  .section-title{margin:34px 0 4px; font-size:20px;}
  .stamp{display:inline-block; border:1.5px solid var(--teal); color:var(--teal-dark); border-radius:999px; padding:5px 12px; font-size:12px; font-weight:700; background:#fff; margin:4px 6px 4px 0;}
  .place-card{background:#fff; border-radius:14px; padding:16px 18px; box-shadow:0 1px 0 rgba(28,43,63,.06); border:1px solid #E1E4D6; margin-bottom:10px;}
  .place-card h3{font-size:15px; margin-bottom:4px;}
  .place-card .meta{font-size:12.5px; color:var(--ink-soft);}
  .place-card .price{font-size:13px; color:var(--teal-dark); font-weight:600; margin-top:4px;}
  .place-card .reason{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
  .day-tabs{display:flex; gap:8px; margin:16px 0; flex-wrap:wrap;}
  .day-tab{border:1.5px solid var(--line); background:#fff; border-radius:999px; padding:6px 16px; font-size:13px; font-weight:600; cursor:pointer; color:var(--ink-soft);}
  .day-tab.active{background:var(--teal); border-color:var(--teal); color:#fff;}
  .day-panel{display:none;}
  .day-panel.active{display:block;}
  .itin-stop{display:flex; gap:14px; margin-bottom:16px; padding-left:2px; border-left:3px solid var(--amber); padding-left:14px;}
  .itin-time{min-width:60px; font-weight:700; font-size:13px; color:var(--amber); flex-shrink:0;}
  .itin-name{font-weight:700; font-size:15px;}
  .itin-type{font-size:12px; color:var(--teal-dark); font-weight:600;}
  .itin-addr{font-size:12.5px; color:var(--ink-soft);}
  .itin-price{font-size:12.5px; color:var(--teal-dark);}
  .itin-reason{font-size:12.5px; color:var(--ink-soft);}
  .menu-notice{font-size:12px; color:var(--ink-soft); margin-top:4px; font-style:italic;}
  @media (max-width:520px){.field-row{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="hero">
  <h1>우리 멤버에 맞는 여정 짜기</h1>
  <p>인원, 나이, 성별, 장소, 예산만 넣으면 실제 데이터로 시간대별 일정까지 짜드려요.</p>
</div>
<div class="wrap">
  <form id="trip-form" class="card">
    <div class="field-row">
      <div class="field">
        <label for="location">장소</label>
        <input id="location" type="text" placeholder="예: 천안, 제주" required />
      </div>
      <div class="field">
        <label for="budget">총 여행경비 (원)</label>
        <input id="budget" type="number" min="0" placeholder="예: 800000" required />
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="days">여행 일수 (1박 2일 → 2)</label>
        <input id="days" type="number" min="1" value="1" />
      </div>
      <div class="field">
        <label>인원수</label>
        <input id="peopleCountDisplay" type="text" readonly />
      </div>
    </div>
    <div class="field">
      <label>인원 (만 나이 + 성별)</label>
      <div id="ages-box" class="ages-box"></div>
      <button type="button" id="add-age" class="add-age">+ 인원 추가</button>
    </div>
    <button type="submit" class="submit-btn" id="submit-btn">여정 추천 받기</button>
    <div id="status" class="status"></div>
  </form>
  <div id="results"></div>
</div>
<script>
const agesBox = document.getElementById('ages-box');
const peopleCountDisplay = document.getElementById('peopleCountDisplay');
function addAgeChip(value=20, gender='male'){
  const chip = document.createElement('div');
  chip.className = 'age-chip';
  chip.innerHTML = `<input type="number" min="0" max="120" value="${value}" />세
    <select>
      <option value="male" ${gender==='male'?'selected':''}>남</option>
      <option value="female" ${gender==='female'?'selected':''}>여</option>
    </select>
    <button type="button">×</button>`;
  chip.querySelector('button').onclick = () => { chip.remove(); updateCount(); };
  agesBox.appendChild(chip);
  updateCount();
}
function updateCount(){ peopleCountDisplay.value = agesBox.querySelectorAll('.age-chip').length + '명'; }
document.getElementById('add-age').onclick = () => addAgeChip();
addAgeChip(32,'male'); addAgeChip(29,'female');
function getPeople(){
  return [...agesBox.querySelectorAll('.age-chip')].map(chip => ({
    age: Number(chip.querySelector('input').value),
    gender: chip.querySelector('select').value,
  }));
}
const form = document.getElementById('trip-form');
const statusEl = document.getElementById('status');
const resultsEl = document.getElementById('results');
const submitBtn = document.getElementById('submit-btn');
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const people = getPeople();
  if(people.length === 0){ statusEl.textContent = '최소 1명의 정보를 입력해주세요.'; statusEl.className='status error'; return; }
  const payload = {
    peopleCount: people.length, people,
    location: document.getElementById('location').value.trim(),
    budget: Number(document.getElementById('budget').value),
    days: Number(document.getElementById('days').value) || 1,
  };
  submitBtn.disabled = true;
  statusEl.className = 'status';
  statusEl.textContent = '여정을 짜는 중입니다... (최대 1분 정도 걸릴 수 있어요)';
  resultsEl.innerHTML = '';
  try {
    const res = await fetch('/api/recommend', {
      method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload),
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || '요청에 실패했습니다.');
    statusEl.textContent = '';
    renderResults(data);
  } catch(err){
    statusEl.className = 'status error';
    statusEl.textContent = err.message;
  } finally { submitBtn.disabled = false; }
});
function placeCard(p){
  return `<div class="place-card"><h3>${p.name}</h3>
    <div class="meta">★ ${p.rating ?? '-'} · 리뷰 ${p.ratingCount ?? 0} · ${p.address || ''}</div>
    ${p.priceEstimate ? `<div class="price">💰 ${p.priceEstimate} <span style="opacity:.6">(추정치)</span></div>` : ''}
    ${p.reason ? `<div class="reason">✓ ${p.reason}</div>` : ''}
    </div>`;
}
function renderSection(title, items){
  if(!items || items.length === 0) return '';
  return `<div class="section-title">${title}</div>${items.map(placeCard).join('')}`;
}
function renderItinerary(itinerary){
  if(!itinerary || itinerary.length === 0) return '';
  const tabs = itinerary.map((d,i) => `<button type="button" class="day-tab ${i===0?'active':''}" data-day="${i}">Day ${d.day}</button>`).join('');
  const panels = itinerary.map((d,i) => `
    <div class="day-panel ${i===0?'active':''}" data-day="${i}">
      ${d.stops.map(s => `
        <div class="itin-stop">
          <div class="itin-time">${s.time}</div>
          <div>
            <div class="itin-type">${s.typeLabel || s.category || ''}</div>
            <div class="itin-name">${s.name}</div>
            <div class="itin-addr">${s.address || ''}</div>
            ${s.priceEstimate ? `<div class="itin-price">💰 ${s.priceEstimate} (추정치)</div>` : ''}
            ${s.reason ? `<div class="itin-reason">✓ ${s.reason}</div>` : ''}
          </div>
        </div>`).join('')}
    </div>`).join('');
  return `
    <div class="section-title">일정표 (시간대별 동선)</div>
    <div class="menu-notice">※ 정확한 메뉴 정보는 없어서 대략적인 음식 종류만 안내해요. 방문 전 리뷰를 참고해주세요.</div>
    <div class="day-tabs">${tabs}</div>
    ${panels}`;
}
function renderResults(data){
  const labels = {infant:'영유아',kid:'어린이',teen:'청소년',young:'청년',middle:'중장년',senior:'시니어'};
  const chips = Object.entries(data.ageProfile.counts).filter(([,c])=>c>0).map(([k,c])=>`<span class="stamp">${labels[k]} ${c}명</span>`).join('');
  const genderChip = data.genderCounts
    ? `<span class="stamp">남 ${data.genderCounts.male || 0}명 · 여 ${data.genderCounts.female || 0}명</span>` : '';
  resultsEl.innerHTML = `
    <div>${chips}${genderChip}<span class="stamp">${data.budgetTier.label}</span></div>
    ${renderItinerary(data.itinerary)}
    ${renderSection('맛집 전체 목록', data.recommendations.restaurants)}
    ${renderSection('카페 전체 목록', data.recommendations.cafes)}
    ${renderSection('숙소 전체 목록', data.recommendations.lodgings)}
    ${renderSection('가볼만한 곳 전체 목록', data.recommendations.attractions)}
  `;
  resultsEl.querySelectorAll('.day-tab').forEach(btn => {
    btn.onclick = () => {
      resultsEl.querySelectorAll('.day-tab').forEach(b => b.classList.remove('active'));
      resultsEl.querySelectorAll('.day-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      resultsEl.querySelector(`.day-panel[data-day="${btn.dataset.day}"]`).classList.add('active');
    };
  });
}
</script>
</body>
</html>
